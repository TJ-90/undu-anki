name: Android CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      anki_provider_gate:
        description: Run the isolated, read-only AnkiDroid provider gate
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
      - run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug
      - name: Collect debug artifact
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/debug/*.apk artifact/
          (cd artifact && sha256sum *.apk > SHA256SUMS)
          printf 'commit=%s\njava=17\ngradle=8.9\nagp=8.7.3\nkotlin=2.0.21\n' "$GITHUB_SHA" > artifact/build-metadata.txt
          echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: android-reports-${{ github.run_id }}
          path: app/build/reports/
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mischief-island-debug-${{ env.SHORT_SHA }}
          path: artifact/
          if-no-files-found: error
          retention-days: 14
  instrumentation:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: 35
          arch: x86_64
          script: ./gradlew :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: instrumentation-reports-${{ github.run_id }}
          path: app/build/reports/androidTests/
          if-no-files-found: warn
  anki-provider-gate:
    if: github.event_name == 'workflow_dispatch' && inputs.anki_provider_gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
      - name: Download pinned official AnkiDroid
        run: |
          curl --fail --location --retry 3 'https://github.com/ankidroid/Anki-Android/releases/download/v2.25.3/variant-abi-AnkiDroid-2.25.3-x86_64.apk' -o "$RUNNER_TEMP/ankidroid.apk"
          echo '154101f06f4ba286248fa4a26863f759d3a1631bd4b1d6790503ec35a85edac7  '"$RUNNER_TEMP/ankidroid.apk" | sha256sum --check
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare isolated provider gate script
        run: |
          cat > "$RUNNER_TEMP/anki-provider-gate.sh" <<'SCRIPT'
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/anki-gate-evidence"
          collect_evidence() {
            # Disposable emulator with a fresh synthetic collection only; never personal data.
            ev="$GITHUB_WORKSPACE/anki-gate-evidence"
            adb shell uiautomator dump /sdcard/final.xml >/dev/null 2>&1 || true
            adb exec-out cat /sdcard/final.xml > "$ev/final-ui.xml" 2>/dev/null || true
            adb logcat -d -v time > "$ev/logcat-full.txt" 2>&1 || true
            grep -E 'ichi2|AnkiDroid|AndroidRuntime|CardContentProvider|ContentResolver|MischiefGate' "$ev/logcat-full.txt" > "$ev/logcat-anki.txt" || true
            rm -f "$ev/logcat-full.txt"
            adb shell dumpsys package com.ichi2.anki > "$ev/dumpsys-package.txt" 2>&1 || true
            adb shell getprop ro.build.version.release > "$ev/android-release.txt" 2>&1 || true
            adb shell dumpsys package com.ichi2.anki | grep -E 'versionName|versionCode' > "$ev/anki-version.txt" 2>&1 || true
            adb shell content query --uri content://com.ichi2.anki.flashcards/decks/1 > "$ev/shell-deck-query.txt" 2>&1 || true
          }
          trap collect_evidence EXIT
          pull_collection() {
            # Copies the disposable emulator's synthetic collection to $1 (rooted adb on the default image).
            adb shell am force-stop com.ichi2.anki
            rm -rf "$1" && mkdir -p "$1"
            adb root >/dev/null 2>&1 || true
            adb wait-for-device
            found=$(adb shell "find /sdcard /storage/emulated /data/media /data/user/0/com.ichi2.anki /data/data/com.ichi2.anki -name 'collection.anki2*' 2>/dev/null" | tr -d '\r' | sort -u)
            printf '%s\n' "$found" >> "$GITHUB_WORKSPACE/anki-gate-evidence/collection-paths.txt"
            main=$(printf '%s\n' "$found" | grep -m1 'collection\.anki2$' || true)
            test -n "$main" || { echo "AnkiDroid collection file not found; see collection-paths.txt"; exit 1; }
            dir=$(dirname "$main")
            for f in $(printf '%s\n' "$found" | grep "^$dir/collection\.anki2"); do adb pull "$f" "$1/" >/dev/null; done
          }
          ev="$GITHUB_WORKSPACE/anki-gate-evidence"
          adb install "$RUNNER_TEMP/ankidroid.apk"
          python3 "$GITHUB_WORKSPACE/.github/scripts/anki-onboard.py" "$ev"
          ./gradlew :app:assembleDebug
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb shell pm grant com.tj90.unduanki.debug com.ichi2.anki.permission.READ_WRITE_DATABASE

          # Phase 1: provider contract, ratings, reconciliation, isolation, catalog.
          ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.tj90.unduanki.anki.AnkiDroidProviderGateTest -Pandroid.testInstrumentationRunnerArguments.anki_provider_gate=true -Pandroid.testInstrumentationRunnerArguments.anki_fixture_ephemeral=true
          pull_collection "$ev/collection"
          python3 "$GITHUB_WORKSPACE/.github/scripts/check-revlog.py" "$ev" "$ev/collection" provider 1,2,3,4,3,1 1500,1500,1500,1500,900,500

          # Phase 2: reset the disposable emulator's AnkiDroid, then drive the real app screens end to end.
          adb shell am force-stop com.ichi2.anki
          adb root >/dev/null 2>&1 || true
          adb wait-for-device
          adb shell rm -rf /sdcard/AnkiDroid
          adb shell pm clear com.ichi2.anki
          python3 "$GITHUB_WORKSPACE/.github/scripts/anki-onboard.py" "$ev"
          # Clearing AnkiDroid also drops this app's grant of its API permission.
          adb shell pm grant com.tj90.unduanki.debug com.ichi2.anki.permission.READ_WRITE_DATABASE
          ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.tj90.unduanki.ui.LiveStudyFlowTest -Pandroid.testInstrumentationRunnerArguments.anki_live_flow=true -Pandroid.testInstrumentationRunnerArguments.anki_fixture_ephemeral=true
          pull_collection "$ev/collection"
          python3 "$GITHUB_WORKSPACE/.github/scripts/check-revlog.py" "$ev" "$ev/collection" live 3,3,3
          SCRIPT
      - name: Prepare fresh collection and run the read-only provider suite
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: 35
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash "$RUNNER_TEMP/anki-provider-gate.sh"
      - name: Upload provider gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: anki-provider-gate-${{ github.run_id }}
          path: |
            anki-gate-evidence/
            app/build/reports/androidTests/
          if-no-files-found: warn
