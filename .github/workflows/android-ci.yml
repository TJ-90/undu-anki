name: Android CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      anki_provider_gate:
        description: Run the isolated, read-only AnkiDroid provider gate
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
      - run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug
      - name: Collect debug artifact
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/debug/*.apk artifact/
          (cd artifact && sha256sum *.apk > SHA256SUMS)
          printf 'commit=%s\njava=17\ngradle=8.9\nagp=8.7.3\nkotlin=2.0.21\n' "$GITHUB_SHA" > artifact/build-metadata.txt
          echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: android-reports-${{ github.run_id }}
          path: app/build/reports/
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mischief-island-debug-${{ env.SHORT_SHA }}
          path: artifact/
          if-no-files-found: error
          retention-days: 14
  instrumentation:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: 35
          arch: x86_64
          script: ./gradlew :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: instrumentation-reports-${{ github.run_id }}
          path: app/build/reports/androidTests/
          if-no-files-found: warn
  anki-provider-gate:
    if: github.event_name == 'workflow_dispatch' && inputs.anki_provider_gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
      - name: Download pinned official AnkiDroid
        run: |
          curl --fail --location --retry 3 'https://github.com/ankidroid/Anki-Android/releases/download/v2.25.3/variant-abi-AnkiDroid-2.25.3-x86_64.apk' -o "$RUNNER_TEMP/ankidroid.apk"
          echo '154101f06f4ba286248fa4a26863f759d3a1631bd4b1d6790503ec35a85edac7  '"$RUNNER_TEMP/ankidroid.apk" | sha256sum --check
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare isolated provider gate script
        run: |
          cat > "$RUNNER_TEMP/anki-provider-gate.sh" <<'SCRIPT'
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/anki-gate-evidence"
          collect_evidence() {
            # Disposable emulator with a fresh synthetic collection only; never personal data.
            ev="$GITHUB_WORKSPACE/anki-gate-evidence"
            adb shell uiautomator dump /sdcard/final.xml >/dev/null 2>&1 || true
            adb exec-out cat /sdcard/final.xml > "$ev/final-ui.xml" 2>/dev/null || true
            adb logcat -d -v time > "$ev/logcat-full.txt" 2>&1 || true
            grep -E 'ichi2|AnkiDroid|AndroidRuntime|CardContentProvider|ContentResolver|MischiefGate' "$ev/logcat-full.txt" > "$ev/logcat-anki.txt" || true
            rm -f "$ev/logcat-full.txt"
            adb shell dumpsys package com.ichi2.anki > "$ev/dumpsys-package.txt" 2>&1 || true
            adb shell getprop ro.build.version.release > "$ev/android-release.txt" 2>&1 || true
            adb shell dumpsys package com.ichi2.anki | grep -E 'versionName|versionCode' > "$ev/anki-version.txt" 2>&1 || true
            adb shell content query --uri content://com.ichi2.anki.flashcards/decks/1 > "$ev/shell-deck-query.txt" 2>&1 || true
          }
          trap collect_evidence EXIT
          adb install "$RUNNER_TEMP/ankidroid.apk"
          adb shell monkey -p com.ichi2.anki -c android.intent.category.LAUNCHER 1
          python3 -c '
          import re, subprocess, time, xml.etree.ElementTree as ET
          from pathlib import Path
          evidence = Path("anki-gate-evidence")
          started = False
          for attempt in range(60):
              time.sleep(2)
              subprocess.run(["adb", "shell", "uiautomator", "dump", "/sdcard/window.xml"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              xml = subprocess.run(["adb", "exec-out", "cat", "/sdcard/window.xml"], capture_output=True).stdout
              (evidence / "onboarding.xml").write_bytes(xml)
              try:
                  root = ET.fromstring(xml)
              except ET.ParseError:
                  continue
              for node in root.iter("node"):
                  resource = node.get("resource-id", "")
                  if resource.endswith(":id/get_started"):
                      bounds = re.fullmatch(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", node.get("bounds", ""))
                      if bounds:
                          x1, y1, x2, y2 = map(int, bounds.groups())
                          subprocess.run(["adb", "shell", "input", "tap", str((x1+x2)//2), str((y1+y2)//2)], check=True)
                          started = True
                          break
              if started:
                  break
          if not started:
              raise SystemExit("AnkiDroid Get started screen not found; see onboarding.xml")
          # Fresh AnkiDroid blocks on a permissions screen (All files access) until granted; the
          # collection is not opened, so the provider returns null cursors. Disposable emulator only.
          subprocess.run(["adb", "shell", "appops", "set", "com.ichi2.anki", "MANAGE_EXTERNAL_STORAGE", "allow"], check=True)
          subprocess.run(["adb", "shell", "monkey", "-p", "com.ichi2.anki", "-c", "android.intent.category.LAUNCHER", "1"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          continued = False
          for attempt in range(40):
              time.sleep(3)
              subprocess.run(["adb", "shell", "uiautomator", "dump", "/sdcard/window.xml"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              xml = subprocess.run(["adb", "exec-out", "cat", "/sdcard/window.xml"], capture_output=True).stdout
              (evidence / "after-get-started.xml").write_bytes(xml)
              try:
                  root = ET.fromstring(xml)
              except ET.ParseError:
                  continue
              if any(n.get("resource-id", "").endswith(":id/deck_picker_content_wrapper") for n in root.iter("node")):
                  continued = True
                  break
              for node in root.iter("node"):
                  if node.get("resource-id", "").endswith(":id/continue_button") and node.get("enabled") == "true":
                      bounds = re.fullmatch(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", node.get("bounds", ""))
                      if bounds:
                          x1, y1, x2, y2 = map(int, bounds.groups())
                          subprocess.run(["adb", "shell", "input", "tap", str((x1+x2)//2), str((y1+y2)//2)], check=True)
                          continued = True
                          break
              if continued:
                  break
          if not continued:
              raise SystemExit("AnkiDroid never reached the deck picker; see after-get-started.xml")
          time.sleep(20)
          subprocess.run(["adb", "shell", "uiautomator", "dump", "/sdcard/after.xml"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          (evidence / "after-continue.xml").write_bytes(subprocess.run(["adb", "exec-out", "cat", "/sdcard/after.xml"], capture_output=True).stdout)
          '
          ./gradlew :app:assembleDebug
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb shell pm grant com.tj90.unduanki.debug com.ichi2.anki.permission.READ_WRITE_DATABASE
          ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.tj90.unduanki.anki.AnkiDroidProviderGateTest -Pandroid.testInstrumentationRunnerArguments.anki_provider_gate=true -Pandroid.testInstrumentationRunnerArguments.anki_fixture_ephemeral=true
          SCRIPT
      - name: Prepare fresh collection and run the read-only provider suite
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: 35
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash "$RUNNER_TEMP/anki-provider-gate.sh"
      - name: Upload provider gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: anki-provider-gate-${{ github.run_id }}
          path: |
            anki-gate-evidence/
            app/build/reports/androidTests/
          if-no-files-found: warn
